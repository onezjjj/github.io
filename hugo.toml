baseURL = "http://localhost:1313/"
languageCode = "zh-cn"
title = "我的IT技术知识库"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true

[pagination]
  pagerSize = 10

[[module.imports]]
  path = "github.com/CaiJimmy/hugo-theme-stack/v4"

[params]
  mainSections = ["posts"]
  rssFullContent = true

[params.sidebar]
  subtitle = "Linux、网络与运维笔记"

[params.article]
  readingTime = true

[params.widgets]
  homepage = [
    { type = "search" },
    { type = "categories", params = { limit = 10 } },
    { type = "tag-cloud", params = { limit = 10 } },
  ]
  page = [{ type = "toc" }]
