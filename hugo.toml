baseURL = "http://localhost:1313/"
languageCode = "zh-cn"
title = "Joss-Hugo博客"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true

[pagination]
  pagerSize = 10

[[module.imports]]
  path = "github.com/CaiJimmy/hugo-theme-stack/v4"

[params]
  mainSections = ["posts"]
  rssFullContent = true

[params.sidebar]
  subtitle = "Linux、网络与运维笔记"

[params.article]
  readingTime = true

[params.comments]
  enabled = true
  provider = "giscus"

[params.comments.giscus]
  repo = "onezjjj/github.io"
  repoID = "R_kgDOVIuWCQ"
  category = "Announcements"
  categoryID = "DIC_kwDOVIuWCc4DIl9q"
  mapping = "pathname"
  strict = 0
  reactionsEnabled = 1
  emitMetadata = 0
  inputPosition = "bottom"
  lightTheme = "preferred_color_scheme"
  darkTheme = "dark_dimmed"
  lang = "zh-CN"
  loading = "lazy"

[params.widgets]
  homepage = [
    { type = "search" },
    { type = "categories", params = { limit = 10 } },
    { type = "tag-cloud", params = { limit = 10 } },
  ]
  page = [{ type = "toc" }]
